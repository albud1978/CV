# Консервативная политика аугментаций для GSE-сцен с мелкими/удалёнными объектами.
# Применяется на этапе обучения (СЛОЙ 4). Совместимо с ultralytics YOLO train cfg.
# RF-DETR обычно подбирает гиперпараметры сам — этот файл актуален для YOLO-ветки.

imgsz: 1280            # критично для объектов < 5% площади кадра
epochs: 150
batch: 16             # RTX 4080 16GB: batch=8 при imgsz=1280; RTX Pro 6000: 16-24
optimizer: AdamW
lr0: 0.001
cos_lr: true

# Mosaic — только в первой половине обучения, закрыть за 10 эпох до конца.
mosaic: 1.0
close_mosaic: 10

# Выключено для мелких быстро движущихся объектов.
mixup: 0.0
copy_paste: 0.0
erasing: 0.0

# Цветовые/геометрические — мягкие.
hsv_h: 0.015
hsv_s: 0.5
hsv_v: 0.4
fliplr: 0.5
flipud: 0.0
scale: 0.5
translate: 0.1
perspective: 0.0
label_smoothing: 0.05
amp: true
