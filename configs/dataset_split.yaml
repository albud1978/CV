# Разбиение датасета по ВИДЕО (источнику) — без утечки между train/val/test.
#
# Принцип: split по video_id, НЕ по кадрам (кадры внутри видео скоррелированы).
# Для стационарных камер сценарий прода = «те же камеры, новые съёмки», поэтому
# каждая локация есть в train, а в val/test вынесены ОТДЕЛЬНЫЕ съёмки (др. день/условия).
#
# positive_window_sec: интервал(ы), где обогреватель присутствует (для сэмплинга
#   позитивов). Кадры вне окна — кандидаты в негативы (пустой перрон / без шланга).
# folder: все файлы в "input/Видео Рощино 23.04.25/".

folder: "input/Видео Рощино 23.04.25"

videos:
  - id: v01
    file: "01_Ст 1_камера 50 2025-04-14T05.57.01-7.07.01.mkv"
    camera: "Ст1_кам50"
    condition: "день"
    split: train
    positive_window_sec: [[0, 2580]]            # до 43 мин

  - id: v06
    file: "06_Ст 2_камера 52 2025-04-14T08.20.01-9.33.01.mkv"
    camera: "Ст2_кам52"
    condition: "день, другой ракурс"
    split: train
    positive_window_sec: [[0, 2340]]            # до 39 мин

  - id: v08
    file: "08_Ст 2_камера 52 2025-04-15T06.20.01-7.30.01.mkv"
    camera: "Ст2_кам52"
    condition: "день"
    split: train
    positive_window_sec: [[0, 2700]]            # до 45 мин

  - id: v11
    file: "11_Ст 2_камера 52 2025-04-16T04.05.01-5.46.01.mkv"
    camera: "Ст2_кам52"
    condition: "ночь/раннее утро"
    split: train
    positive_window_sec: [[0, 1320]]            # до 22 мин

  - id: v13
    file: "13_Cт 2-1-4У 2025-04-14T05.57.01-7.44.01.mkv"
    camera: "Ст2-1-4У"
    condition: "день, объект далеко"
    split: train
    positive_window_sec: [[0, 4680]]            # до 1ч18мин

  - id: v21
    file: "21_Стоянка 9 2025-04-14T14.40.37-15.33.25.mkv"
    camera: "Стоянка9"
    condition: "день"
    split: train
    positive_window_sec: [[900, null]]          # с 15 мин до конца

  - id: v10
    file: "10_Ст 2_камера 52 2025-04-15T23.11.25-2025-04-16T00.05.01.mkv"
    camera: "Ст2_кам52"
    condition: "ночь"
    split: val
    positive_window_sec: [[300, null]]          # с 5 мин до конца

  - id: v12
    file: "12_Ст 2_камера 52 2025-04-16T20.35.15-21.30.01.mkv"
    camera: "Ст2_кам52"
    condition: "вечер, дождь"
    split: test
    positive_window_sec: [[360, null]]          # с 6 мин до конца

  - id: v22
    file: "22_Стоянка 9 2025-04-14T20.06.01-21.21.41.mkv"
    camera: "Стоянка9"
    condition: "вечер"
    split: test
    positive_window_sec: [[0, 2160]]            # до 36 мин

# Сводка по разбиению (по видео):
#   train: v01, v06, v08, v11, v13, v21   (все локации представлены)
#   val:   v10                            (ночь, камера 52)
#   test:  v12 (дождь), v22 (вечер)       (новые условия тех же камер)

sampling:
  # негативы (пустой перрон/без шланга) берём вне positive_window
  negatives_per_video: 15
  # внутри окна — кадры по движению (motion) + равномерная подложка
  positive_strategy: "motion+uniform"
