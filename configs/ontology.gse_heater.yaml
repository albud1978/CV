# Онтология задачи «обогреватель подключён к ВС» — ЕДИНЫЙ ИСТОЧНИК ПРАВДЫ конвейера.
#
# Этот файл читают ВСЕ слои: teacher.py (какие промпты гонять), autoqa.py (что
# выбрасывать), link.py (что сглаживать по времени), relation.py + events.py
# (как из детекций получить факт подключения), to_yolo.py (какие классы учить).
# Меняем поведение конвейера ЗДЕСЬ, а не в коде.
#
# Постановка (уточнено заказчиком):
#   - Интересует НЕ сам юнит, а ФАКТ подключения широкого гофрошланга к ВС.
#   - heater = будка/тележка на колёсах (unit) + ШИРОКИЙ гофрошланг (wide_hose),
#     подключённый к самолёту. Без шланга юнит не интересен.
#   - Наземный источник питания (GPU) выглядит так же, НО от него идёт ТОНКИЙ
#     кабель, а не широкий шланг -> служит для отстройки (negative).
#   - Цель: тайм-коды переходов CONNECTED <-> DISCONNECTED.
#
# ТИП ПРОЕКТА: instance-segmentation (маски, а не bbox).
#   Гибкий шланг изогнут по диагонали -> axis-aligned bbox покрывает огромную пустую
#   область; маска ложится по форме. Толщину шланга (2*S/P) меряем ПО МАСКЕ -> это
#   и есть отстройка от тонкого кабеля. Bbox для detect-ветки выводится из маски
#   автоматически (to_yolo.py --task detect), так что «сначала детекция» не требует
#   отдельной разметки.
#
# ЭМПИРИКА SAM 3 PCS (Roboflow Auto Label) — проверено, НЕ переоткрывать:
#   - SAM 3 чувствителен к КОНКРЕТНОМУ слову, а не к смыслу.
#   - Несколько промптов на ОДИН объект конкурируют -> NMS схлопывает в один класс.
#     Отсюда правило: ОДИН КОНЦЕПТ НА ПРОХОД, слияние — офлайн (fuse.py).
#   - SEG-режим: "hose" -> 1 чистая маска/кадр по форме рукава (в detection была каша).
#   - SEG-режим: "generator" -> садится на тележку, recall ~половина кадров.
#     "cart"/"machine"/"vehicle"/"trailer" — кандидаты на добор recall юнита.
#   - "cable" монополизирует тонкие объекты -> только отдельным проходом.
#   - "person" ловит и пассажиров -> разводим офлайн по цвету жилета.
#   - Фразы ("wide flexible hose", "air conditioning unit", "worker in safety vest") -> 0.
#   - Roboflow дедуплицирует кадры ПО КОНТЕНТУ на весь воркспейс: повторный autolabel
#     ПЕРЕЗАПИСЫВАЕТ аннотации общей записи. Поэтому по умолчанию учитель локальный
#     (teacher.py --backend local), а Roboflow используется для ревью/версий/обучения.

version: 3
task_type: instance-segmentation

# --- Атомарные классы, которые учит студент (YOLO11-seg) ---
classes:
  - class_id: 0
    label: unit                      # будка/тележка на колёсах (heater ИЛИ GPU)
    positive_prompts: ["generator", "cart", "machine"]
    negative_prompts: ["aircraft engine", "whole airplane"]
    synonyms: ["ground unit", "wheeled cart", "booth"]
    confidence: 0.20
    train: true
    stationary: true                 # для link.py: объект стоит -> трек-голосование работает
    visual_rules: >
      Компактный бокс/будка на колёсной тележке у ВС. Сам по себе НЕ определяет heater —
      нужен признак широкого шланга рядом (см. derived.heater_complex).

  - class_id: 1
    label: wide_hose                 # ШИРОКИЙ гофрошланг обогревателя (ключевой позитив)
    positive_prompts: ["hose"]
    negative_prompts: ["thin cable", "power cable", "narrow tube"]
    synonyms: ["heater duct", "corrugated duct"]
    confidence: 0.30
    train: true
    stationary: true
    visual_rules: >
      Толстый гофрированный рукав от юнита к брюху ВС. НЕ размечать тонкие кабели,
      провода и шланги малого диаметра.

  - class_id: 2
    label: cable                     # тонкий кабель — дискриминатор GPU
    positive_prompts: ["cable"]
    confidence: 0.20
    train: true
    stationary: true
    visual_rules: >
      Тонкий кабель от наземного источника питания. unit + cable (без wide_hose)
      => это GPU, НЕ heater. Размечается ОТДЕЛЬНЫМ проходом (иначе съедает hose).

  - class_id: 3
    label: aircraft                  # ВС — вторая опора логики подключения
    positive_prompts: ["airplane"]
    confidence: 0.25
    train: true
    stationary: true
    visual_rules: >
      Фюзеляж/самолёт на стоянке. Нужен, чтобы отличить «шланг лежит на перроне»
      от «шланг заведён под борт». Без этого класса состояние определяется только
      резервным правилом по присутствию шланга (см. connection.fallback).

  # Персонал и пассажиры разводятся ОФЛАЙН по цвету жилета (SAM 3 даёт только "person").
  - class_id: 4
    label: staff                     # наземный персонал в светоотражающем жилете
    derived_from: person
    confidence: 0.30
    train: true
    stationary: false                # люди двигаются -> трек-голосование ОТКЛЮЧЕНО
    rule: "доля hi-vis пикселей в маске >= person_split.vest_fraction_threshold"

  - class_id: 5
    label: passenger                 # пассажир без жилета (посадка/высадка)
    derived_from: person
    confidence: 0.30
    train: true
    stationary: false
    rule: "person без признака жилета"

# --- Проходы учителя: ОДИН КОНЦЕПТ НА ПРОХОД ---
# Порядок важен: «жадные» промпты (cable) идут последними, чтобы при офлайн-слиянии
# их можно было подавить уже найденными широкими шлангами.
autolabel:
  teacher: sam3                      # local: autodistill-sam3 | roboflow: autolabel_start
  project_type: instance-segmentation
  model_options: { outputFormat: polygon }
  passes:
    - { name: hose,     prompt: "hose",      maps_to: wide_hose, confidence: 0.30 }
    - { name: unit,     prompt: "generator", maps_to: unit,      confidence: 0.20 }
    - { name: unit_alt, prompt: "cart",      maps_to: unit,      confidence: 0.20 }
    - { name: aircraft, prompt: "airplane",  maps_to: aircraft,  confidence: 0.25 }
    - { name: person,   prompt: "person",    maps_to: person,    confidence: 0.30 }
    - { name: cable,    prompt: "cable",     maps_to: cable,     confidence: 0.20 }

# --- Разделение person -> staff/passenger по цвету жилета (офлайн) ---
person_split:
  method: hi_vis_vest_color
  # HSV (OpenCV: H 0-179, S/V 0-255). Несколько диапазонов под разные цвета жилетов.
  hsv_ranges:
    - { lower: [28, 60, 80],  upper: [75, 255, 255] }   # лайм / жёлто-зелёный
    - { lower: [10, 90, 110], upper: [27, 255, 255] }   # оранжевый
  vest_fraction_threshold: 0.06
  note: "Пассажиры без жилета -> доля ~0. Порог/цвета подбираются по QA."

# --- Автоматический контроль качества псевдоразметки ---
# Все пороги в px даны для кадра шириной reference_width и масштабируются под факт.
# Философия: выбрасываем агрессивно (лучше меньше, но чище), причина каждого
# отброса пишется в rejections.jsonl -> видно, не срезали ли мы полезное.
autoqa:
  reference_width: 1280
  nms_iou: 0.5
  min_polygon_points: 3
  area_frac:                         # доля площади кадра [min, max]
    unit:       [0.00020, 0.20]
    wide_hose:  [0.00010, 0.25]
    cable:      [0.00003, 0.15]
    aircraft:   [0.00500, 0.95]
    staff:      [0.00003, 0.08]
    passenger:  [0.00003, 0.08]
  max_per_image:
    unit: 4
    wide_hose: 3
    aircraft: 2
    cable: 6
    staff: 25
    passenger: 40
  wide_hose:
    min_thickness_px: 8              # реальный гофрошланг ~15px; тонкий кабель <6px
    max_thickness_px: 140            # толще — это уже не рукав, а кузов/тень
    min_elongation: 2.0              # длинная сторона minAreaRect / короткая
  cable:
    max_thickness_px: 10             # кабель толще порога -> вероятно, тот же шланг
  proximity:
    hose_to_unit_px: 250             # шланг всегда рядом с юнитом (уточнение заказчика)
    keep_hose_without_unit: true     # юнит не найден -> шланг не теряем (recall)
    cable_suppressed_by_hose_iou: 0.3  # кабель поверх найденного шланга -> дубль

# --- Временная консистентность (link.py): статичные камеры дают дешёвый прирост ---
link:
  enabled: true
  iou_threshold: 0.25                # порог связывания масок соседних кадров
  max_gap_frames: 2                  # сколько пропусков внутри трека прощаем
  min_track_len: 2                   # трек короче -> мигание, считаем ложным
  apply_to_stationary_only: true     # людей не режем (они реально появляются на 1 кадр)
  fill_gaps: false                   # интерполяция пропусков (агрессивный прирост меток)

# --- Производные сущности и логика подключения ---
derived:
  heater_complex:
    rule: "unit AND wide_hose в пределах proximity_px друг от друга"
    proximity_px: 250
    note: "unit + thin cable (без wide_hose) => GPU, исключить."

connection:
  gap_px: 60                         # конец шланга ближе gap_px к ВС -> подключён
  min_hose_length_px: 60             # совсем короткие маски не считаем рукавом
  # Резерв, когда ВС в кадре не найдено (ночь, ракурс, борт вне поля зрения):
  # присутствие широкого шланга рядом с юнитом само по себе означает подключение
  # (эмпирика заказчика: рукав раскатывают только под работу).
  fallback:
    enabled: true
    score: 0.55                      # ниже, чем у геометрического подтверждения
  scores:
    connected_geometric: 0.95        # конец шланга касается/перекрывает ВС
    connected_near: 0.75             # конец в пределах gap_px
    disconnected_hose_absent: 0.02   # юнит/ВС видно, широкого шланга нет
    disconnected_hose_far: 0.15      # шланг есть, но конец далеко от борта

# --- Конечный автомат событий (events.py) ---
events:
  hold_seconds: 30.0                 # окно сглаживания (антидребезг)
  enter_threshold: 0.60              # средний score в окне -> переход в connected
  exit_threshold: 0.35               # гистерезис: выход при падении ниже
  min_episode_seconds: 60.0          # эпизоды короче — служебный шум, схлопываем
  unknown_policy: hold               # hold | disconnected — как трактовать «не видно»
  initial_state: disconnected
  transitions:
    - { name: hose_connected,    trigger: "disconnected -> connected" }
    - { name: hose_disconnected, trigger: "connected -> disconnected" }

# --- Обучение студента и деплой ---
student:
  arch: yolo11s-seg                  # маски нужны для геометрии подключения
  edge_arch: yolo11n-seg             # вариант под телефон
  imgsz: 1280                        # мелкие/удалённые объекты (правило проекта)
  edge_imgsz: 640
  export_formats: [onnx, ncnn, tflite]
  license_note: >
    Ultralytics YOLO — AGPL-3.0. Для встраивания в распространяемый продукт нужна
    коммерческая лицензия Ultralytics ЛИБО замена студента на RF-DETR (Apache-2.0).
    Учитель SAM 3 — лицензия Meta SAM, проверить field-of-use перед продом.

# --- Приёмка (гейты) ---
acceptance:
  teacher_ap_min: 0.70               # G1 на golden-set
  map50_min: 0.75                    # G3 фаза 1
  map50_target: 0.90                 # фаза 2
  event_onset_tolerance_sec: 120.0   # допустимая ошибка тайм-кода события
  max_false_events_per_video: 1
